<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Comparison of bench conditions and arena conditions for a robot">
<style>text{font-family:Instrument Sans,Helvetica,Arial,sans-serif;fill:#222}.h{font-size:17px;font-weight:600}.l{font-size:14px;font-weight:600;fill:#666}.t{font-size:15px}</style>
<rect width="820" height="330" fill="#fff"/>
<rect x="150" y="20" width="310" height="44" rx="8" fill="#eef3ee" stroke="#cfdccf"/><text class="h" x="305" y="49" text-anchor="middle">Bench (where it was built)</text>
<rect x="480" y="20" width="310" height="44" rx="8" fill="#f9e9ee" stroke="#e8c3cf"/><text class="h" x="635" y="49" text-anchor="middle">Arena (where it is judged)</text>
<text class="l" x="30" y="116">Lighting</text>
<rect x="150" y="84" width="310" height="48" rx="8" fill="#fafafa" stroke="#e6e6e6"/><text class="t" x="305" y="114" text-anchor="middle">Steady and familiar</text>
<rect x="480" y="84" width="310" height="48" rx="8" fill="#fafafa" stroke="#e6e6e6"/><text class="t" x="635" y="114" text-anchor="middle">Changes through the day</text>
<text class="l" x="30" y="174">Battery</text>
<rect x="150" y="142" width="310" height="48" rx="8" fill="#fafafa" stroke="#e6e6e6"/><text class="t" x="305" y="172" text-anchor="middle">Freshly charged</text>
<rect x="480" y="142" width="310" height="48" rx="8" fill="#fafafa" stroke="#e6e6e6"/><text class="t" x="635" y="172" text-anchor="middle">Drains during the round</text>
<text class="l" x="30" y="232">Surface</text>
<rect x="150" y="200" width="310" height="48" rx="8" fill="#fafafa" stroke="#e6e6e6"/><text class="t" x="305" y="230" text-anchor="middle">The floor you tuned on</text>
<rect x="480" y="200" width="310" height="48" rx="8" fill="#fafafa" stroke="#e6e6e6"/><text class="t" x="635" y="230" text-anchor="middle">A finish you have not seen</text>
<text class="l" x="30" y="290">Time</text>
<rect x="150" y="258" width="310" height="48" rx="8" fill="#fafafa" stroke="#e6e6e6"/><text class="t" x="305" y="288" text-anchor="middle">No clock</text>
<rect x="480" y="258" width="310" height="48" rx="8" fill="#fafafa" stroke="#e6e6e6"/><text class="t" x="635" y="288" text-anchor="middle">Hard time limit</text>
<text x="410" y="322" text-anchor="middle" style="font-size:13px;fill:#666">Same robot, different conditions</text></svg>