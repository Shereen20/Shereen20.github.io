<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="A loop: model predicts, choose what to test, run the experiment, retrain"><style>text{font-family:Instrument Sans,Helvetica,Arial,sans-serif;fill:#222}.h{font-size:15px;font-weight:600}.n{font-size:12.5px;fill:#555}.l{font-size:13px;font-weight:600;fill:#666}.t{font-size:14px}</style><rect width="820" height="320" fill="#fff"/><text class="l" x="20" y="26">A SMALL BUDGET, SPENT WELL</text><rect x="60" y="60" width="300" height="86" rx="10" fill="#f9e9ee" stroke="#e8c3cf"/><text class="h" x="210" y="96" text-anchor="middle">1. Model predicts</text><text class="n" x="210" y="120" text-anchor="middle">scores every candidate, with an uncertainty</text><rect x="460" y="60" width="300" height="86" rx="10" fill="#f9e9ee" stroke="#e8c3cf"/><text class="h" x="610" y="96" text-anchor="middle">2. Choose what to test</text><text class="n" x="610" y="120" text-anchor="middle">favour candidates the model is unsure about</text><rect x="460" y="200" width="300" height="86" rx="10" fill="#f9e9ee" stroke="#e8c3cf"/><text class="h" x="610" y="236" text-anchor="middle">3. Run the experiment</text><text class="n" x="610" y="260" text-anchor="middle">a fixed number of measurements</text><rect x="60" y="200" width="300" height="86" rx="10" fill="#f9e9ee" stroke="#e8c3cf"/><text class="h" x="210" y="236" text-anchor="middle">4. Retrain on the results</text><text class="n" x="210" y="260" text-anchor="middle">the model improves, then repeat</text><path d="M362 103 L451.0 103.0" stroke="#a4264f" stroke-width="2.5" fill="none"/><path d="M458 103 L451.0 107.2 L451.0 98.8 Z" fill="#a4264f"/><path d="M610 148 L610.0 191.0" stroke="#a4264f" stroke-width="2.5" fill="none"/><path d="M610 198 L605.8 191.0 L614.2 191.0 Z" fill="#a4264f"/><path d="M458 243 L369.0 243.0" stroke="#a4264f" stroke-width="2.5" fill="none"/><path d="M362 243 L369.0 238.8 L369.0 247.2 Z" fill="#a4264f"/><path d="M210 198 L210.0 155.0" stroke="#a4264f" stroke-width="2.5" fill="none"/><path d="M210 148 L214.2 155.0 L205.8 155.0 Z" fill="#a4264f"/></svg>