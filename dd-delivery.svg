<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="Bars showing an injected dose shrinking to a very small share that reaches the tumour"><style>text{font-family:Instrument Sans,Helvetica,Arial,sans-serif;fill:#222}.h{font-size:15px;font-weight:600}.n{font-size:12.5px;fill:#555}.l{font-size:13px;font-weight:600;fill:#666}.t{font-size:14px}</style><rect width="820" height="330" fill="#fff"/><text class="l" x="20" y="26">WHERE AN INJECTED DOSE GOES (ILLUSTRATIVE, NOT TO SCALE)</text><rect x="60" y="60" width="700" height="40" rx="6" fill="#eef3ee" stroke="#cfdccf"/><text class="h" x="76" y="85">Injected dose</text><rect x="60" y="122" width="420" height="40" rx="6" fill="#f9e9ee" stroke="#e8c3cf"/><text class="h" x="76" y="147">Cleared by liver and spleen</text><rect x="60" y="184" width="250" height="40" rx="6" fill="#f6f6f4" stroke="#ddd"/><text class="h" x="76" y="209">Other tissues and blood</text><rect x="60" y="246" width="24" height="40" rx="6" fill="#fff1c7" stroke="#e3c76a"/><text class="h" x="94" y="271">Tumour</text><text class="n" x="60" y="140" style="opacity:0"> </text><text class="t" x="60" y="308">Median reaching a solid tumour: about 0.7% of the injected dose (Wilhelm et al., 2016)</text></svg>