<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-label="Four panels of order variability growing from customer demand to factory orders"><style>text{font-family:Instrument Sans,Helvetica,Arial,sans-serif;fill:#222}.h{font-size:15px;font-weight:600}.n{font-size:12.5px;fill:#555}.l{font-size:13px;font-weight:600;fill:#666}.t{font-size:14px}</style><rect width="820" height="290" fill="#fff"/><text class="l" x="20" y="26">ONE DEMAND SIGNAL, FOUR STAGES</text><rect x="20" y="44" width="180" height="170" rx="10" fill="#f6f6f4" stroke="#e6e6e6"/><path d="M30 129 H190" stroke="#ccc" stroke-dasharray="3 4"/><polyline points="34.0,125.9 53.0,129.5 72.0,127.4 91.0,130.2 110.0,130.5 129.0,123.8 148.0,123.2 167.0,133.0 186.0,126.1" fill="none" stroke="#2f6f4f" stroke-width="2.5" stroke-linejoin="round"/><text class="h" x="110" y="238" text-anchor="middle">Customer demand</text><path d="M202 129 L212.0 129.0" stroke="#888" stroke-width="2" fill="none"/><path d="M218 129 L212.0 132.6 L212.0 125.4 Z" fill="#888"/><rect x="220" y="44" width="180" height="170" rx="10" fill="#f6f6f4" stroke="#e6e6e6"/><path d="M230 129 H390" stroke="#ccc" stroke-dasharray="3 4"/><polyline points="234.0,122.7 253.0,130.1 272.0,125.9 291.0,131.5 310.0,132.0 329.0,118.6 348.0,117.3 367.0,137.1 386.0,123.2" fill="none" stroke="#a4264f" stroke-width="2.5" stroke-linejoin="round"/><text class="h" x="310" y="238" text-anchor="middle">Retailer orders</text><path d="M402 129 L412.0 129.0" stroke="#888" stroke-width="2" fill="none"/><path d="M418 129 L412.0 132.6 L412.0 125.4 Z" fill="#888"/><rect x="420" y="44" width="180" height="170" rx="10" fill="#f6f6f4" stroke="#e6e6e6"/><path d="M430 129 H590" stroke="#ccc" stroke-dasharray="3 4"/><polyline points="434.0,117.5 453.0,130.9 472.0,123.3 491.0,133.6 510.0,134.5 529.0,109.9 548.0,107.6 567.0,143.8 586.0,118.4" fill="none" stroke="#a4264f" stroke-width="2.5" stroke-linejoin="round"/><text class="h" x="510" y="238" text-anchor="middle">Wholesaler orders</text><path d="M602 129 L612.0 129.0" stroke="#888" stroke-width="2" fill="none"/><path d="M618 129 L612.0 132.6 L612.0 125.4 Z" fill="#888"/><rect x="620" y="44" width="180" height="170" rx="10" fill="#f6f6f4" stroke="#e6e6e6"/><path d="M630 129 H790" stroke="#ccc" stroke-dasharray="3 4"/><polyline points="634.0,109.1 653.0,132.4 672.0,119.1 691.0,136.9 710.0,138.6 729.0,96.0 748.0,92.0 767.0,154.6 786.0,110.7" fill="none" stroke="#a4264f" stroke-width="2.5" stroke-linejoin="round"/><text class="h" x="710" y="238" text-anchor="middle">Factory orders</text><text class="n" x="410" y="272" text-anchor="middle">Each stage reacts to the orders it sees, so small swings in demand grow as they move upstream</text></svg>